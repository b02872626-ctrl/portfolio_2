<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Calendar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
:where(a.lk){display:inline-flex;align-items:center;justify-content:center;text-align:center;color:inherit;text-decoration:none;cursor:pointer}:where(a.lkb){display:block;color:inherit;text-decoration:none;cursor:pointer}a.lk.row,a.lk.item,a.lk.r,a.lk.b,a.lk.set,a.lk.note{justify-content:flex-start;text-align:left}a.lk.b{align-items:flex-start}
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:14px;color:#141A2E}
.seg{flex:1 1 0;min-height:40px;border-radius:12px;font-size:14px;font-weight:600;color:#636B80}
.seg.on{background:#FFFFFF;color:#141A2E;font-weight:700}
.wd{font-size:12.5px;color:#636B80;text-align:center;padding:2px 0 8px;font-weight:600}
.cell{height:42px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums}
.cell .n{width:32px;height:32px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.cell.mut{color:#C9D2E3}
.cell.sel .n{background:#2F6BE3;color:#FFFFFF}
.dot{width:4px;height:4px;border-radius:50%;background:#2F6BE3}
.chk{flex:0 0 44px;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.chk i{display:block;width:26px;height:26px;border-radius:50%;border:2px solid #C9D2E3}
.ag{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 18px;background:#FFFFFF;border-radius:18px}
.t{font-size:15.5px;font-weight:700}
.s{font-size:13.5px;color:#636B80;margin-top:4px}

@keyframes lpSheet{from{transform:translateY(100%)}to{transform:none}}@keyframes lpDim{from{background-color:#F2F4F9}}@keyframes lpPop{0%{opacity:0;transform:scale(.92)}60%{opacity:1;transform:scale(1.02)}100%{transform:none}}@keyframes lpUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes lpDrop{from{opacity:0;transform:translateY(-28px) scale(.98)}to{opacity:1;transform:none}}@keyframes lpLeft{from{transform:translateX(-100%)}to{transform:none}}@keyframes lpFade{from{opacity:0}to{opacity:1}}@keyframes lpTick{0%{transform:scale(.4)}55%{transform:scale(1.18)}100%{transform:none}}@keyframes lpGrow{from{width:20%}}@keyframes lpPulse{0%,100%{box-shadow:0 0 0 0 rgba(199,55,47,.45)}50%{box-shadow:0 0 0 6px rgba(199,55,47,0)}}section[style*="border-radius: 28px 28px 0 0"]{animation:lpSheet .42s cubic-bezier(.2,.9,.25,1) both}div[style*="background: #8E95A6"]{animation:lpDim .3s ease-out both}section[role="alertdialog"]{animation:lpPop .32s cubic-bezier(.2,.9,.25,1) .05s both}nav[aria-label="Main menu"]{animation:lpLeft .38s cubic-bezier(.2,.9,.25,1) both}article[aria-label="Loop notification"]{animation:lpDrop .5s cubic-bezier(.2,.9,.25,1) .15s both}[role="status"]{animation:lpUp .36s cubic-bezier(.2,.9,.25,1) .25s both}h1{animation:lpUp .4s cubic-bezier(.2,.9,.25,1) both}.grp,.note,.ag,.empty{animation:lpUp .45s cubic-bezier(.2,.9,.25,1) .06s both}.grp+.grp,.lab+.grp{animation-delay:.1s}div[aria-hidden="true"][style*="border-radius: 50%; background: #2F6BE3"]{animation:lpTick .5s cubic-bezier(.2,.9,.25,1) .1s both}.chk.on i{animation:lpTick .4s cubic-bezier(.2,.9,.25,1) both}[role="progressbar"]>div{animation:lpGrow .6s cubic-bezier(.2,.9,.25,1) .1s both}[aria-label="Add task"],[aria-label="New note"]{animation:lpPop .4s cubic-bezier(.2,.9,.25,1) .18s both}[aria-label^="Now,"] span{animation:lpPulse 2s ease-in-out infinite}a.lk,a.lkb,button{transition:transform .14s ease,filter .14s ease,background-color .2s ease}a.lk:active,button:active{transform:scale(.96)}a.lkb:active{transform:scale(.985)}a.lk:hover,button:hover{filter:brightness(.97)}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; background: #F2F4F9; color: #141A2E; font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative;">
  <header style="padding: 18px 24px 0;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <a href="NSideMenu2.html" class="lk ib" aria-label="Open menu" style="margin-left: -10px;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px;"><path d="M4 8h16M4 16h10"></path></svg></a>
      <button style="min-height: 40px; padding: 0 16px; border-radius: 12px; background: #FFFFFF; font-size: 14px; font-weight: 700; color: #2F6BE3;">Today</button>
    </div>
    <div style="display: flex; align-items: baseline; gap: 10px; margin-top: 14px;">
      <h1 style="margin: 0; font-size: 36px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em;">October</h1>
      <span style="font-size: 18px; font-weight: 600; color: #636B80;">2026</span>
    </div>
  </header>

  <div role="group" aria-label="View" style="display: flex; gap: 4px; margin: 18px 24px 0; padding: 4px; background: #E4E8F1; border-radius: 15px;">
    <button class="seg on">Month</button><a href="NCalWeek.html" class="lk seg">Week</a><a href="NCalDay.html" class="lk seg">Day</a>
  </div>

  <div style="margin: 14px 24px 0; background: #FFFFFF; border-radius: 22px; padding: 16px 10px 8px;">
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));">
      <div class="wd">S</div><div class="wd">M</div><div class="wd">T</div><div class="wd">W</div><div class="wd">T</div><div class="wd">F</div><div class="wd">S</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));">
      
        <div class="cell mut"><span class="n">27</span><span class="dot" style="opacity: 0;"></span></div>
      
        <div class="cell mut"><span class="n">28</span><span class="dot" style="opacity: 0;"></span></div>
      
        <div class="cell mut"><span class="n">29</span><span class="dot" style="opacity: 0;"></span></div>
      
        <div class="cell mut"><span class="n">30</span><span class="dot" style="opacity: 0;"></span></div>
      
        <div class="cell"><span class="n">1</span><span class="dot" style="opacity: 0;"></span></div>
      
        <div class="cell"><span class="n">2</span><span class="dot" style="opacity: 1;"></span></div>
      
        <div class="cell"><span class="n">3</span><span class="dot" style="opacity: 0;"></span></div>
      
        <div class="cell"><span class="n">4</span><span class="dot" style="opacity: 0;"></span></div>
      
        <div class="cell"><span class="n">5</span><span class="dot" style="opacity: 0;"></span></div>
      
        <div class="cell"><span class="n">6</span><span class="dot" style="opacity: 1;"></span></div>
      
        <div class="cell"><span class="n">7</span><span class="dot" style="opacity: 0;"></span></div>
      
        <div class="cell"><span class="n">8</span><span class="dot" style="opacity: 0;"></span></div>
      
        <div class="cell"><span class="n">9</span><span class="dot" style="opacity: 1;"></span></div>
      
        <div class="cell"><span class="n">10</span><span class="dot" style="opacity: 0;"></span></div>
      
        <div class="cell"><span class="n">11</span><span class="dot" style="opacity: 0;"></span></div>
      
        <div class="cell"><span class="n">12</span><span class="dot" style="opacity: 1;"></span></div>
      
        <div class="cell"><span class="n">13</span><span class="dot" style="opacity: 1;"></span></div>
      
        <div class="cell"><span class="n">14</span><span class="dot" style="opacity: 1;"></span></div>
      
        <div class="cell"><span class="n">15</span><span class="dot" style="opacity: 1;"></span></div>
      
        <div class="cell sel"><span class="n">16</span><span class="dot" style="opacity: 1;"></span></div>
      
        <div class="cell"><span class="n">17</span><span class="dot" style="opacity: 0;"></span></div>
      
        <div class="cell"><span class="n">18</span><span class="dot" style="opacity: 0;"></span></div>
      
        <div class="cell"><span class="n">19</span><span class="dot" style="opacity: 1;"></span></div>
      
        <div class="cell"><span class="n">20</span><span class="dot" style="opacity: 1;"></span></div>
      
        <div class="cell"><span class="n">21</span><span class="dot" style="opacity: 0;"></span></div>
      
        <div class="cell"><span class="n">22</span><span class="dot" style="opacity: 1;"></span></div>
      
        <div class="cell"><span class="n">23</span><span class="dot" style="opacity: 0;"></span></div>
      
        <div class="cell"><span class="n">24</span><span class="dot" style="opacity: 0;"></span></div>
      
        <div class="cell"><span class="n">25</span><span class="dot" style="opacity: 0;"></span></div>
      
        <div class="cell"><span class="n">26</span><span class="dot" style="opacity: 0;"></span></div>
      
        <div class="cell"><span class="n">27</span><span class="dot" style="opacity: 1;"></span></div>
      
        <div class="cell"><span class="n">28</span><span class="dot" style="opacity: 0;"></span></div>
      
        <div class="cell"><span class="n">29</span><span class="dot" style="opacity: 0;"></span></div>
      
        <div class="cell"><span class="n">30</span><span class="dot" style="opacity: 1;"></span></div>
      
        <div class="cell"><span class="n">31</span><span class="dot" style="opacity: 0;"></span></div>
      
    </div>
  </div>

  <div style="padding: 22px 24px 10px; font-size: 14px; font-weight: 700; color: #636B80;">Friday, Oct 16</div>
  <div style="padding: 0 24px; display: flex; flex-direction: column; gap: 10px;">
    <div class="ag"><div style="flex-grow: 1;"><div class="t">Review onboarding wireframes</div><div class="s">10:00 – 11:00 · Work</div></div><a href="NDoneUndo.html" class="lk chk" aria-label="Mark done"><i style="border-color: #C7372F;"></i></a></div>
    <div class="ag"><div style="flex-grow: 1;"><div class="t">Team sync</div><div class="s">11:00 – 11:30 · Google Calendar</div></div><a href="NDoneUndo.html" class="lk chk" aria-label="Mark done"><i></i></a></div>
    <div class="ag"><div style="flex-grow: 1;"><div class="t">Send invoice to client</div><div class="s">14:00 · Work</div></div><a href="NDoneUndo.html" class="lk chk" aria-label="Mark done"><i></i></a></div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 110px; background: linear-gradient(to bottom, rgba(242,244,249,0), #F2F4F9 55%); display: flex; align-items: center; justify-content: center;">
    <a href="VQuickAdd.html" class="lk" aria-label="Add task" style="width: 64px; height: 64px; border-radius: 22px; background: #2F6BE3; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 28px; height: 28px; stroke-width: 2.4;"><path d="M12 5v14M5 12h14"></path></svg></a>
  </div>
</div>
</body>
</html>
