<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Date and reminder (dark)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
:where(a.lk){display:inline-flex;align-items:center;justify-content:center;text-align:center;color:inherit;text-decoration:none;cursor:pointer}:where(a.lkb){display:block;color:inherit;text-decoration:none;cursor:pointer}a.lk.row,a.lk.item,a.lk.r,a.lk.b,a.lk.set,a.lk.note{justify-content:flex-start;text-align:left}a.lk.b{align-items:flex-start}
body{margin:0;color-scheme:dark} *{box-sizing:border-box} button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.c{min-height:38px;padding:0 14px;border-radius:12px;background:#0F1320;font-size:14px;font-weight:700;color:#9AA3B8;white-space:nowrap}
.c.on{background:#2F6BE3;color:#FFFFFF}
.wd{font-size:12px;color:#9AA3B8;text-align:center;font-weight:600;padding-bottom:6px}
.cell{height:40px;display:flex;align-items:center;justify-content:center;font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums}
.cell span{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.cell.mut{color:#3A4357}
.cell.today span{color:#7AA2FF;font-weight:800}
.cell.sel span{background:#2F6BE3;color:#FFFFFF}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:54px;font-size:15.5px;font-weight:600;text-align:left;border-top:1px solid #0F1320}
.row .v{margin-left:auto;font-size:15px;font-weight:700;color:#7AA2FF}

@keyframes lpSheet{from{transform:translateY(100%)}to{transform:none}}@keyframes lpDim{from{background-color:#0F1320}}@keyframes lpPop{0%{opacity:0;transform:scale(.92)}60%{opacity:1;transform:scale(1.02)}100%{transform:none}}@keyframes lpUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes lpDrop{from{opacity:0;transform:translateY(-28px) scale(.98)}to{opacity:1;transform:none}}@keyframes lpLeft{from{transform:translateX(-100%)}to{transform:none}}@keyframes lpFade{from{opacity:0}to{opacity:1}}@keyframes lpTick{0%{transform:scale(.4)}55%{transform:scale(1.18)}100%{transform:none}}@keyframes lpGrow{from{width:20%}}@keyframes lpPulse{0%,100%{box-shadow:0 0 0 0 rgba(199,55,47,.45)}50%{box-shadow:0 0 0 6px rgba(199,55,47,0)}}section[style*="border-radius: 28px 28px 0 0"]{animation:lpSheet .42s cubic-bezier(.2,.9,.25,1) both}div[style*="background: #05070D"]{animation:lpDim .3s ease-out both}section[role="alertdialog"]{animation:lpPop .32s cubic-bezier(.2,.9,.25,1) .05s both}nav[aria-label="Main menu"]{animation:lpLeft .38s cubic-bezier(.2,.9,.25,1) both}article[aria-label="Loop notification"]{animation:lpDrop .5s cubic-bezier(.2,.9,.25,1) .15s both}[role="status"]{animation:lpUp .36s cubic-bezier(.2,.9,.25,1) .25s both}h1{animation:lpUp .4s cubic-bezier(.2,.9,.25,1) both}.grp,.note,.ag,.empty{animation:lpUp .45s cubic-bezier(.2,.9,.25,1) .06s both}.grp+.grp,.lab+.grp{animation-delay:.1s}div[aria-hidden="true"][style*="border-radius: 50%; background: #2F6BE3"]{animation:lpTick .5s cubic-bezier(.2,.9,.25,1) .1s both}.chk.on i{animation:lpTick .4s cubic-bezier(.2,.9,.25,1) both}[role="progressbar"]>div{animation:lpGrow .6s cubic-bezier(.2,.9,.25,1) .1s both}[aria-label="Add task"],[aria-label="New note"]{animation:lpPop .4s cubic-bezier(.2,.9,.25,1) .18s both}[aria-label^="Now,"] span{animation:lpPulse 2s ease-in-out infinite}a.lk,a.lkb,button{transition:transform .14s ease,filter .14s ease,background-color .2s ease}a.lk:active,button:active{transform:scale(.96)}a.lkb:active{transform:scale(.985)}a.lk:hover,button:hover{filter:brightness(1.12)}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; background: #05070D; color: #E8ECF5; font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <a class="lkb" href="DVTaskDetail.html" aria-label="Close" style="flex-grow: 1;"></a>
  <section aria-label="Date and reminder" style="background: #1A2030; border-radius: 28px 28px 0 0; padding: 12px 24px 24px; display: flex; flex-direction: column; gap: 14px;">
    <div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #3A4357;"></div>
    <div style="display: flex; gap: 8px; overflow: hidden;">
      <button class="c">Today</button><button class="c">Tomorrow</button><button class="c on">Tue, Oct 20</button><button class="c">No date</button>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span style="font-size: 17px; font-weight: 800;">October 2026</span>
      <span style="display: flex; gap: 4px;">
        <button aria-label="Previous month" style="width: 40px; height: 40px; border-radius: 12px; background: #0F1320; display: flex; align-items: center; justify-content: center;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
        <button aria-label="Next month" style="width: 40px; height: 40px; border-radius: 12px; background: #0F1320; display: flex; align-items: center; justify-content: center;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
      </span>
    </div>
    <div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));"><div class="wd">S</div><div class="wd">M</div><div class="wd">T</div><div class="wd">W</div><div class="wd">T</div><div class="wd">F</div><div class="wd">S</div></div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));">
        <div class="cell mut"><span>27</span></div><div class="cell mut"><span>28</span></div><div class="cell mut"><span>29</span></div><div class="cell mut"><span>30</span></div><div class="cell"><span>1</span></div><div class="cell"><span>2</span></div><div class="cell"><span>3</span></div><div class="cell"><span>4</span></div><div class="cell"><span>5</span></div><div class="cell"><span>6</span></div><div class="cell"><span>7</span></div><div class="cell"><span>8</span></div><div class="cell"><span>9</span></div><div class="cell"><span>10</span></div><div class="cell"><span>11</span></div><div class="cell"><span>12</span></div><div class="cell"><span>13</span></div><div class="cell"><span>14</span></div><div class="cell"><span>15</span></div><div class="cell today"><span>16</span></div><div class="cell"><span>17</span></div><div class="cell"><span>18</span></div><div class="cell"><span>19</span></div><div class="cell sel"><span>20</span></div><div class="cell"><span>21</span></div><div class="cell"><span>22</span></div><div class="cell"><span>23</span></div><div class="cell"><span>24</span></div><div class="cell"><span>25</span></div><div class="cell"><span>26</span></div><div class="cell"><span>27</span></div><div class="cell"><span>28</span></div><div class="cell"><span>29</span></div><div class="cell"><span>30</span></div><div class="cell"><span>31</span></div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column;">
      <a href="DNTimeSheet.html" class="lk row"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: #9AA3B8;"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>Time<span class="v">10:00 – 11:00</span></a>
      <a href="DNReminder.html" class="lk row"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: #9AA3B8;"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>Reminder<span class="v">15 min before</span></a>
      <a href="DNRepeat.html" class="lk row"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: #9AA3B8;"><path d="M17 3l3 3-3 3M4 11V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 0 1-3 3H4"></path></svg>Repeat<span class="v" style="color: #9AA3B8;">Never</span></a>
    </div>
    <a href="DVTaskDetail.html" class="lk" style="min-height: 56px; border-radius: 18px; background: #2F6BE3; color: #FFFFFF; font-size: 16px; font-weight: 800;">Done</a>
  </section>
</div>
</body>
</html>
